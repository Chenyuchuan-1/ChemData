[project]
name = "chem-pdf-scientific"
version = "0.1.0"
description = "MinerU adapter, PDF processing, and chemistry validation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "pillow>=10.4",
  "rdkit>=2024.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
mineru = ["mineru[pipeline]"]
atommap = ["rxnmapper"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
